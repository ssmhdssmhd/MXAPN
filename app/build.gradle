apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 读取签名配置（优先从环境变量，其次从 local.properties）
def signingKeyStorePath = System.getenv("SIGNING_KEYSTORE_PATH") ?: ""
def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS") ?: ""
def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD") ?: ""
def signingStorePassword = System.getenv("SIGNING_STORE_PASSWORD") ?: ""

// 从 local.properties 读取（本地开发用）
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
    if (signingKeyStorePath.isEmpty()) signingKeyStorePath = localProps.getProperty("signing.storeFile", "")
    if (signingKeyAlias.isEmpty()) signingKeyAlias = localProps.getProperty("signing.keyAlias", "")
    if (signingKeyPassword.isEmpty()) signingKeyPassword = localProps.getProperty("signing.keyPassword", "")
    if (signingStorePassword.isEmpty()) signingStorePassword = localProps.getProperty("signing.storePassword", "")
}

// 使用 Gradle 的 file() 解析（相对于当前模块目录）
def keystoreFile = signingKeyStorePath ? file(signingKeyStorePath) : null
def hasKeystore = keystoreFile != null && keystoreFile.exists()

android {
    namespace 'com.mx.apn'
    compileSdk 34

    defaultConfig {
        applicationId "com.mx.apn"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "0.0.3"
        vectorDrawables.useSupportLibrary = true
    }

    // 签名配置
    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 如果签名配置可用，则签名
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
