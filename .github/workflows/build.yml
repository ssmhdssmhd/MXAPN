name: Build MXAPN APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: MXAPN

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > app/mxapn-release.keystore
          ls -la app/mxapn-release.keystore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        env:
          SIGNING_KEYSTORE_PATH: mxapn-release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version
        id: version
        run: |
          VERSION_NAME=$(grep versionName app/build.gradle | head -1 | sed 's/.*versionName "\(.*\)".*/\1/')
          BUILD_TIME=$(date +"%Y%m%d%H%M")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=${VERSION_NAME}_${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ env.APP_NAME }}.${{ steps.version.outputs.VERSION_NAME }}.${{ steps.version.outputs.BUILD_TIME }}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${{ env.APP_NAME }}.${{ steps.version.outputs.VERSION_NAME }}.${{ steps.version.outputs.BUILD_TIME }}-release.apk"
          fi
          ls -la *.apk

      - name: Verify APK signature
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "=== Release APK 签名信息 ==="
            keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk || echo "签名验证命令失败"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.FULL_VERSION }}-debug
          path: ${{ env.APP_NAME }}.${{ steps.version.outputs.VERSION_NAME }}.${{ steps.version.outputs.BUILD_TIME }}-debug.apk

      - name: Upload Signed Release APK artifact
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.FULL_VERSION }}-release-signed
          path: ${{ env.APP_NAME }}.${{ steps.version.outputs.VERSION_NAME }}.${{ steps.version.outputs.BUILD_TIME }}-release.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f app/mxapn-release.keystore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.APP_NAME }}.${{ steps.version.outputs.VERSION_NAME }}.${{ steps.version.outputs.BUILD_TIME }}-release.apk
          name: ${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION_NAME }}
          body: |
            ## MXAPN 版本更新日志
            - 版本号: ${{ steps.version.outputs.VERSION_NAME }}
            - 编译时间: ${{ steps.version.outputs.BUILD_TIME }}
            - 已签名 Release APK
            - 自动构建于 GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
